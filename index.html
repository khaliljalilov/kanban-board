<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Tapşırıq Lövhəsi</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <nav class="kanban__nav">
            <div class="nav__logo">K</div>
            <h1 class="nav__header">Kanban İdarəetmə</h1>
            <input type="text" class="nav__searching" placeholder="Axtar...">
            <div class="filter__wrap">
                <span class="dot dot--all" id="filter-dot"></span>
                <select name="priority" id="nav_selector" class="nav__selector">
                    <option value="all">Bütün tapşırıqlar</option>
                    <option value="low">Aşağı</option>
                    <option value="medium">Orta</option>
                    <option value="high">Çətin</option>
                </select>
            </div>
            <button class="new__task" id="new-task">+ Yeni Tapşırıq</button>
        </nav>
    </header>

    <main id="board">
        <div class="board__grid">

            <!-- Gözləyir sütunu -->
            <section class="board__column" id="col-todo">
                <div class="board__column-header">
                    <div class="board__column-title">
                        <span class="board__dot board__dot--todo"></span>
                        <h2>Gözləyir</h2>
                    </div>
                    <span class="board__count" id="count-todo">0</span>
                </div>
                <div class="board__cards" id="cards-todo"></div>
            </section>

            <!-- İcra edilir sütunu -->
            <section class="board__column" id="col-inprogress">
                <div class="board__column-header">
                    <div class="board__column-title">
                        <span class="board__dot board__dot--inprogress"></span>
                        <h2>İcra edilir</h2>
                    </div>
                    <span class="board__count" id="count-inprogress">0</span>
                </div>
                <div class="board__cards" id="cards-inprogress"></div>
            </section>

            <!-- Tamamlandı sütunu -->
            <section class="board__column" id="col-done">
                <div class="board__column-header">
                    <div class="board__column-title">
                        <span class="board__dot board__dot--done"></span>
                        <h2>Tamamlandı</h2>
                    </div>
                    <span class="board__count" id="count-done">0</span>
                </div>
                <div class="board__cards" id="cards-done"></div>
            </section>

        </div>
    </main>
    <div class="modal" id="modal">
    <div class="modal__box">

        <div class="modal__header">
            <h2 class="modal__title">Yeni Tapşırıq</h2>
            <button class="modal__close" id="modal-close">✕</button>
        </div>

        <div class="modal__body">
            <div class="form__group">
                <label for="task-title">Başlıq</label>
                <input type="text" id="task-title" placeholder="Tapşırığın adı...">
            </div>

            <div class="form__group">
                <label for="task-priority">Prioritet</label>
                <select id="task-priority">
                    <option value="low">Aşağı</option>
                    <option value="medium">Orta</option>
                    <option value="high">Çətin</option>
                </select>
            </div>

            <div class="form__group">
                <label for="task-column">Sütun</label>
                <select id="task-column">
                    <option value="todo">Gözləyir</option>
                    <option value="inprogress">İcra edilir</option>
                    <option value="done">Tamamlandı</option>
                </select>
            </div>
        </div>

        <div class="modal__footer">
            <button class="btn__cancel" id="modal-cancel">Ləğv et</button>
            <button class="new__task" id="modal-save">Saxla</button>
        </div>

    </div>
</div>

  

    <script src="./script.js"></script>
</body>

</html>
